<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>COSC 473 Part 2 Exercise 4</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar-pill">
        <div class="topbar-left">
          <span class="dot"></span>
          <span class="brand">>> cosc473OS</span>
          <span class="path">~/tictactoe/</span>
        </div>

        <div class="topbar-right">
          <span class="status-light"></span>
          <span class="status-light"></span>
          <span class="status-light"></span>
        </div>
      </div>
    </header>

    <!-- TWO WINDOWS -->
    <main class="desktop">
      <!-- LEFT WINDOW GAME BAR -->
      <section class="window window-left">
        <div class="window-titlebar">
          <span class="window-title">>> Game Bar</span>
          <div class="window-controls">
            <span class="ctrl"></span>
            <span class="ctrl"></span>
            <span class="ctrl"></span>
          </div>
        </div>

        <div class="window-content">
          <div id="ttt-status" class="ttt-status">Turn: O</div>

          <div id="ttt-board" class="ttt-board">
            <!-- board generated by gs -->
          </div>

          <div class="ttt-controls">
            <button id="ttt-reset" class="ttt-btn">Reset</button>
          </div>

          <div class="mode-terminal">
            <span class="ps-prefix">PS C:\cosc473\tictactoe&gt;</span>
            <input
              id="mode-input"
              class="mode-input"
              type="text"
              placeholder="type minimax or alphabeta"
              autocomplete="off"
              spellcheck="false"
            />
          </div>

          <div id="mode-feedback" class="mode-feedback">
            Current mode: minimax
          </div>
        </div>
      </section>

      <!-- RIGHT WINDOW FOR THINKING -->
      <section class="window window-right">
        <div class="window-titlebar">
          <span class="window-title">>> AI Thought Process</span>
          <div class="window-controls">
            <span class="ctrl"></span>
            <span class="ctrl"></span>
            <span class="ctrl"></span>
          </div>
        </div>

        <div class="window-content">
          <div id="thinking-root"></div>
        </div>
      </section>
    </main>
    <script src="./src/ai.js"></script>
    <script src="./src/thinking.js"></script>
    <script src="./src/ttt.js"></script>
  </body>
</html>
